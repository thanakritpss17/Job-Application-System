<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>สมัครงานออนไลน์ - Maritime Recruitment</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;
      /* บังคับให้อยู่ตรงกลางหน้าจอทั้งแนวตั้งและแนวนอน */
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px 20px;
      
      /* เอฟเฟกต์พื้นหลังธีมทะเลลึก */
      background: 
        linear-gradient(rgba(10, 25, 47, 0.75), rgba(10, 25, 47, 0.92)),
        url('https://images.unsplash.com/photo-1517371194098-7690629b3ae3?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .main-card {
      width: 100%;
      max-width: 700px;
      /* ผลลัพธ์ความโปร่งแสงแบบกระจก (Glassmorphism) */
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      
      border-radius: 24px;
      padding: 45px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fillIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fillIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #075985, #0284c7);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 42px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      border: 4px solid #ffffff;
    }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #475569;
      font-size: 15px;
      margin-bottom: 35px;
    }

    /* ตกแต่ง Input Form */
    .form-control, .form-select {
      height: 52px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      padding-left: 16px;
      background: rgba(255, 255, 255, 0.7);
      color: #0f172a;
      font-size: 15px;
      transition: all 0.25s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: #0284c7;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    /* โซนกล่องอัปโหลดไฟล์ */
    .upload-box {
      background: rgba(240, 249, 255, 0.7);
      border: 2px dashed #38bdf8;
      border-radius: 16px;
      padding: 20px;
      transition: background 0.2s ease;
    }

    .upload-box:hover {
      background: #f0f9ff;
    }

    .form-label-custom {
      color: #0369a1;
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 8px;
      display: block;
    }

    /* ตกแต่งปุ่มอัปโหลดภายในกล่องให้ดูสะอาดตาขึ้น */
    .upload-box .form-control {
      height: auto;
      padding: 8px 12px;
      background: #ffffff;
      font-size: 14px;
    }

    /* ปุ่มส่งใบสมัคร */
    .btn-submit {
      height: 56px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7, #1e40af);
      color: white;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
      width: 100%;
      margin-top: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.25);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.4);
      filter: brightness(1.1);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
      color: #0284c7;
      font-weight: 500;
      font-size: 15px;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      padding-top: 20px;
    }

    .footer-icon {
      color: #38bdf8;
      margin-right: 4px;
    }
  </style>
</head>

<body>

<div class="main-card">
  <div class="logo-container">
    <div class="logo">🚢</div>
  </div>

  <div class="title">สมัครงานออนไลน์</div>
  <div class="subtitle">กรุณากรอกข้อมูลเพื่อร่วมออกเดินทางไปกับเรา</div>

  <form id="jobForm">
    <div class="row">
      <div class="col-md-6 mb-3">
        <input type="text" id="firstName" class="form-control" placeholder="ชื่อ" required />
      </div>
      <div class="col-md-6 mb-3">
        <input type="text" id="lastName" class="form-control" placeholder="นามสกุล" required />
      </div>
    </div>

    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="อีเมล (Email)" required />
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <input type="text" id="phone" class="form-control" placeholder="เบอร์โทรศัพท์" required />
      </div>
      <div class="col-md-6 mb-3">
        <select id="education" class="form-select" required>
          <option value="" selected disabled>เลือกระดับการศึกษา</option>
          <option value="ป.6">ป.6</option>
          <option value="มัธยมต้น">มัธยมต้น</option>
          <option value="มัธยมปลาย">มัธยมปลาย</option>
          <option value="ปริญญาตรี">ปริญญาตรี</option>
          <option value="ปริญญาโท">ปริญญาโท</option>
          <option value="ปริญญาเอก">ปริญญาเอก</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <input type="number" step="0.01" id="gpa" class="form-control" placeholder="เกรดเฉลี่ย (GPA)" required />
    </div>

    <div class="upload-box mb-3">
      <label class="form-label-custom">📷 รูปภาพผู้สมัคร (JPG / PNG)</label>
      <input type="file" id="image" class="form-control" accept=".jpg,.jpeg,.png" required />
    </div>

    <div class="upload-box mb-4">
      <label class="form-label-custom">📄 เอกสาร PDF (Resume / CV)</label>
      <input type="file" id="pdf" class="form-control" accept=".pdf" required />
    </div>

    <button id="submitBtn" class="btn-submit">ส่งใบสมัครร่วมทีม</button>

    <div id="loading" class="loading">
      ⚓ กำลังกางใบเรือและส่งข้อมูลระบบ...
    </div>
  </form>

  <div class="footer">
    <span class="footer-icon">⚓</span> Maritime Career Portal Solutions
  </div>
</div>

<script>
  // ส่วนสคริปต์การทำงานดั้งเดิมของคุณยังคงอยู่ครบถ้วนและปลอดภัยในการเชื่อมต่อส่งฐานข้อมูล
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4_vM10V_YgZ9ZZqOwaEyii_oOuiMjXzwxrsn0kG8LOVtFw7fGyGyw26KZeiGQeehm/exec";

  document.getElementById("jobForm").addEventListener("submit", async function(e){
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const loading = document.getElementById("loading");

    submitBtn.disabled = true;
    submitBtn.innerHTML = "กำลังส่งข้อมูล...";
    loading.style.display = "block";

    try {
      const imageFile = document.getElementById("image").files[0];
      const pdfFile = document.getElementById("pdf").files[0];

      const imageBase64 = await toBase64(imageFile);
      const pdfBase64 = await toBase64(pdfFile);

      const data = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        education: document.getElementById("education").value,
        gpa: document.getElementById("gpa").value,
        image: {
          fileName: imageFile.name,
          mimeType: imageFile.type,
          base64: imageBase64.split(",")[1]
        },
        pdf: {
          fileName: pdfFile.name,
          mimeType: pdfFile.type,
          base64: pdfBase64.split(",")[1]
        }
      };

      const response = await fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if(result.status === "success") {
        alert("สมัครงานสำเร็จ! ระบบได้รับข้อมูลของท่านแล้ว");
        document.getElementById("jobForm").reset();
      } else {
        alert("เกิดข้อผิดพลาด: " + result.message);
      }
    }
    catch(error){
      console.log(error);
      alert("ไม่สามารถส่งข้อมูลได้ กรุณาตรวจสอบการเชื่อมต่อของคุณ");
    }
    finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = "ส่งใบสมัครร่วมทีม";
      loading.style.display = "none";
    }
  });

  function toBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }
</script>

</body>
</html>
